name: square_grab
description: "Collecte les carrés de la carte en te déplaçant dans le monde réel."
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_foreground_task: ^10.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
